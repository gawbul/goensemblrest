name: push_tag

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0.0, v0.1.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test and Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Run unit tests with race detection
        run: |
          go test -v -race .

      - name: Build packages and example binary
        run: |
          go build -v ./...
          mkdir -p dist
          go build -v -o dist/goensemblrest-example ./examples

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

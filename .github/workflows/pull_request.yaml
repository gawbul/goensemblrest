name: pull_request

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - '.github/workflows/pull_request.yaml'
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - '.github/workflows/pull_request.yaml'

# Automatically cancel redundant in-progress workflow runs for new commits on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality & Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run gofmt check
        run: |
          DIFF=$(gofmt -s -l .)
          if [ -n "$DIFF" ]; then
            echo "The following files are not properly formatted:"
            echo "$DIFF"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true

  unit-test:
    name: Unit Tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: false

      - name: Run offline unit tests with race detection and coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic .

      - name: Build example binary
        run: |
          go build -v -o /dev/null ./examples

      - name: Upload Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  live-test:
    name: Live Ensembl API Smoke Test
    needs: [unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Run live smoke tests against Ensembl REST API
        run: |
          ENSEMBL_LIVE_TESTS=1 go test -v -tags=live -race -run TestLiveEnsemblAPI .
